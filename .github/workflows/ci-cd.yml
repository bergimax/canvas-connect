name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Fast checks, run in parallel. Neither depends on the other, so GitHub
  # Actions schedules them concurrently.
  # ---------------------------------------------------------------------

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps
        run: make backend-install

      # In-process suite against SQLite (backend/tests) — no Docker needed.
      - name: Run backend tests
        run: make test

  frontend-tests:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: make frontend-install

      - name: Run frontend tests
        run: make test-frontend

      - name: Typecheck + lint
        run: make lint

      - name: Build frontend
        run: cd frontend && npm run build

  # ---------------------------------------------------------------------
  # Builds the real Docker Compose stack (app + Postgres) and runs the
  # integration and e2e suites against it. Both suites manage the compose
  # stack's lifecycle themselves (up/down), so this job just needs Docker
  # (preinstalled on ubuntu-latest) plus the tooling to drive the tests.
  # Runs after both fast-check jobs pass.
  # ---------------------------------------------------------------------

  integration-and-e2e:
    name: Integration & E2E tests (Docker Compose stack)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (pytest runner for integration tests)
        run: make backend-install

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Builds the docker-compose.yml stack (image not yet cached on the
      # runner) and runs pytest against the live containers.
      - name: Run integration tests against docker compose
        run: make test-integration

      - name: Install e2e deps (Playwright + browser)
        run: make e2e-install

      # Reuses the image built by the integration step above.
      - name: Run e2e tests against docker compose
        run: make test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Build once, tag with the commit sha, push to ECR. This is the same
  # image the tests above already exercised the compose stack with is
  # what actually gets deployed below — the EC2 instance pulls this tag
  # rather than rebuilding from source on every deploy.
  #
  # AWS isn't provisioned yet, so — like the deploy job below — this job
  # no-ops cleanly instead of failing until the required repo
  # secrets/variables exist. See the deploy job's comment for the full list
  # and the IAM permissions each job needs.
  # ---------------------------------------------------------------------

  build-and-push:
    name: Build & push image to ECR
    runs-on: ubuntu-latest
    needs: [integration-and-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    outputs:
      ready: ${{ steps.aws_ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS deploy is configured
        id: aws_ready
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ] || [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::notice::AWS_ROLE_ARN secret and/or AWS_REGION variable not set — AWS isn't provisioned yet, skipping build/push."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.aws_ready.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        if: steps.aws_ready.outputs.ready == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        if: steps.aws_ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/canvas-connect"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ---------------------------------------------------------------------
  # Deploy to AWS. Authenticates via GitHub OIDC (no long-lived AWS keys)
  # and redeploys the EC2 instance provisioned by deploy/cloudformation.yml
  # (see deploy/deploy.sh) by asking it, over SSM (no SSH), to pull the
  # image build-and-push just pushed and restart the Docker Compose stack,
  # then confirms the app is actually up by polling its health endpoint —
  # automatically rolling back to the last known-good image if it isn't.
  #
  # AWS isn't provisioned yet, so this job is written to no-op cleanly
  # instead of failing until the required repo secrets/variables exist:
  #   Secrets:
  #     AWS_ROLE_ARN        - IAM role ARN GitHub OIDC assumes (see below)
  #   Variables:
  #     AWS_REGION           - e.g. eu-west-1
  #     DEPLOY_HEALTH_URL     - the app's /health endpoint to check after
  #                             deploy, e.g. http://<elastic-ip>/health or
  #                             https://<domain>/health — without it the
  #                             deploy is unverified and rollback can't
  #                             trigger, since there's nothing to detect
  #                             failure with
  #
  # Once deploy/cloudformation.yml has been deployed and those are set,
  # this job starts deploying for real with no further changes needed.
  #
  # The IAM role trust policy should scope the OIDC subject to this repo,
  # e.g.:
  #   repo:<org>/<repo>:ref:refs/heads/main
  # and the role needs permission for:
  #   ec2:DescribeInstances, ssm:SendCommand, ssm:GetCommandInvocation,
  #   ssm:GetParameter, ssm:PutParameter (on parameter /canvas-connect/*),
  #   ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,
  #   ecr:PutImage, ecr:InitiateLayerUpload, ecr:UploadLayerPart,
  #   ecr:CompleteLayerUpload, ecr:BatchGetImage (on the canvas-connect
  #   ECR repository)
  # ---------------------------------------------------------------------

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: needs.build-and-push.outputs.ready == 'true'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy, health-check, and roll back on failure
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: bash deploy/deploy.sh
