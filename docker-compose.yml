services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canvas_connect
      POSTGRES_PASSWORD: canvas_connect
      POSTGRES_DB: canvas_connect
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas_connect"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: canvas-connect:local
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://canvas_connect:canvas_connect@db:5432/canvas_connect
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the image (stripped after building the frontend
      # stage) — python3 is always there, so use it as the probe.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  db-data:
