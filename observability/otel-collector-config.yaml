# Fans incoming OTLP telemetry out to the backend that stores each signal:
# traces to Tempo, logs to Loki, metrics scraped by Prometheus from this
# collector's own /metrics endpoint below. See docker-compose.yml.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Loki 3.x ingests OTLP logs natively at /otlp/v1/logs; the exporter
  # appends that path itself given just the base URL.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Pull-based: Prometheus scrapes this endpoint (see prometheus.yml)
  # rather than the collector pushing to Prometheus.
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions: [health_check]
  # Defaults to binding the collector's own metrics to localhost, which
  # Prometheus (a separate container) can't reach — bind to all interfaces
  # so the "otel-collector-internal" scrape job in prometheus.yml works.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
