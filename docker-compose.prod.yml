# Production override, layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds Caddy as the public entry point (TLS via Let's Encrypt once
# SITE_ADDRESS is set to a real domain; plain HTTP on :80 until then) and
# injects the real DB password / public URL from the .env file instead of
# the docker-compose.yml dev defaults.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  app:
    environment:
      DATABASE_URL: postgresql+psycopg://canvas_connect:${DB_PASSWORD}@db:5432/canvas_connect
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      # Set by whatever runs `docker compose ... up -d` here (deploy/deploy.sh,
      # and the first-boot bootstrap in deploy/cloudformation.yml) so traces
      # are tagged with the real stack/build instead of the "local" dev
      # default in docker-compose.yml. See app/telemetry.py.
      ENVIRONMENT: ${ENVIRONMENT}
      APP_VERSION: ${APP_VERSION}
      # The shared observability stack's collector (deploy/observability-
      # cloudformation.yml) — from .env, since it changes rarely and isn't
      # tied to a specific deploy the way ENVIRONMENT/APP_VERSION are.
      # Empty means no telemetry export, same as local dev.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":-" (not "-") so an empty SITE_ADDRESS (the normal "no domain yet"
      # case — see .env.example) falls back to ":80" too, not just an
      # unset one: Caddy's own {$VAR:default} syntax only applies its
      # default when the env var is truly unset, and Compose always sets
      # it (to "") once it's referenced in this block at all.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
