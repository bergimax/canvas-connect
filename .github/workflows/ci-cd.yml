name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Fast checks, run in parallel. Neither depends on the other, so GitHub
  # Actions schedules them concurrently.
  # ---------------------------------------------------------------------

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps
        run: make backend-install

      # In-process suite against SQLite (backend/tests) — no Docker needed.
      - name: Run backend tests
        run: make test

  frontend-tests:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: make frontend-install

      - name: Run frontend tests
        run: make test-frontend

      - name: Typecheck + lint
        run: make lint

      - name: Build frontend
        run: cd frontend && npm run build

  # ---------------------------------------------------------------------
  # Builds the real Docker Compose stack (app + Postgres) and runs the
  # integration and e2e suites against it. Both suites manage the compose
  # stack's lifecycle themselves (up/down), so this job just needs Docker
  # (preinstalled on ubuntu-latest) plus the tooling to drive the tests.
  # Runs after both fast-check jobs pass.
  # ---------------------------------------------------------------------

  integration-and-e2e:
    name: Integration & E2E tests (Docker Compose stack)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (pytest runner for integration tests)
        run: make backend-install

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Builds the docker-compose.yml stack (image not yet cached on the
      # runner) and runs pytest against the live containers.
      - name: Run integration tests against docker compose
        run: make test-integration

      - name: Install e2e deps (Playwright + browser)
        run: make e2e-install

      # Reuses the image built by the integration step above.
      - name: Run e2e tests against docker compose
        run: make test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # =======================================================================
  # BUILD STAGE — builds the image exactly once and pushes it, tagged, to
  # BOTH the dev and prod ECR repos (deploy/cloudformation.yml provisions
  # one independent stack per environment — see its top comment). Pushing
  # to both means any commit that lands on main is immediately promotable
  # to production later via promote-to-production.yml, with no rebuild and
  # no re-copy step. The deploy stage below (and promote-to-production.yml)
  # never builds anything — they only ever pull a tag this stage already
  # pushed, so what runs anywhere is bit-for-bit what CI actually tested.
  #
  # Tag format: YYYYMMDD-HHMMSS-<7-char short sha> (e.g.
  # 20260818-163457-83242da), computed at build time — sortable, human-
  # readable, and still traceable back to the exact commit. "latest" is
  # also pushed, purely for deploy/cloudformation.yml's EC2 boot bootstrap
  # (see its UserData) to have something to pull on a brand-new instance.
  #
  # AWS isn't provisioned yet, so — like the deploy stage below — this job
  # no-ops cleanly instead of failing until the required repo
  # secrets/variables exist. See the deploy-dev job's comment for the full
  # list and the IAM permissions each job needs.
  # =======================================================================

  build:
    name: "Build stage: build & push image to ECR"
    runs-on: ubuntu-latest
    needs: [integration-and-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    outputs:
      ready: ${{ steps.aws_ready.outputs.ready }}
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          ts=$(date -u +%Y%m%d-%H%M%S)
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${ts}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Check AWS deploy is configured
        id: aws_ready
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ] || [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::notice::AWS_ROLE_ARN secret and/or AWS_REGION variable not set — AWS isn't provisioned yet, skipping build/push."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.aws_ready.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        if: steps.aws_ready.outputs.ready == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to both environments' ECR repos
        if: steps.aws_ready.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          BUILD_TAG="$REGISTRY/canvas-connect-dev:${IMAGE_TAG}"
          docker build -t "$BUILD_TAG" .
          for repo in canvas-connect-dev canvas-connect-prod; do
            docker tag "$BUILD_TAG" "$REGISTRY/$repo:${IMAGE_TAG}"
            docker tag "$BUILD_TAG" "$REGISTRY/$repo:latest"
            docker push "$REGISTRY/$repo:${IMAGE_TAG}"
            docker push "$REGISTRY/$repo:latest"
          done

  # =======================================================================
  # DEPLOY STAGE (dev) — pulls the tag the build stage just pushed and
  # restarts the dev instance with it; never builds anything itself.
  # Authenticates via GitHub OIDC (no long-lived AWS keys) and redeploys
  # the "canvas-connect-dev" EC2 instance provisioned by
  # deploy/cloudformation.yml (Environment=dev) (see deploy/deploy.sh) by
  # asking it, over SSM (no SSH), to pull that exact tag and restart the
  # Docker Compose stack, then confirms the app is actually up by polling
  # its health endpoint — automatically rolling back to the last known-good
  # tag if the health check fails.
  #
  # Runs automatically on every push to main. Deploying the same tag to
  # production is a separate, manual step — see promote-to-production.yml,
  # which pulls whatever tag is currently deployed here in dev.
  #
  # AWS isn't provisioned yet, so this job is written to no-op cleanly
  # instead of failing until the required "development" GitHub Environment
  # secrets/variables exist:
  #   Secrets:
  #     AWS_ROLE_ARN        - IAM role ARN GitHub OIDC assumes (see below)
  #   Variables:
  #     AWS_REGION           - e.g. eu-west-1
  #     DEPLOY_HEALTH_URL     - the dev app's /health endpoint to check
  #                             after deploy, e.g.
  #                             http://<dev-elastic-ip>/health — without
  #                             it the deploy is unverified and rollback
  #                             can't trigger, since there's nothing to
  #                             detect failure with
  #
  # Once deploy/cloudformation.yml has been deployed with Environment=dev
  # and those are set on a "development" GitHub Environment, this job
  # starts deploying for real with no further changes needed.
  #
  # The IAM role trust policy should scope the OIDC subject to this repo,
  # e.g.:
  #   repo:<org>/<repo>:ref:refs/heads/main
  # and the role needs permission for:
  #   ec2:DescribeInstances, ssm:SendCommand, ssm:GetCommandInvocation,
  #   ssm:GetParameter, ssm:PutParameter (on parameter
  #   /canvas-connect/dev/*), ecr:GetAuthorizationToken,
  #   ecr:BatchGetImage (on the canvas-connect-dev ECR repository)
  # =======================================================================

  deploy-dev:
    name: "Deploy stage: deploy to dev"
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.outputs.ready == 'true'
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy, health-check, and roll back on failure
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          ENVIRONMENT: dev
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: bash deploy/deploy.sh
